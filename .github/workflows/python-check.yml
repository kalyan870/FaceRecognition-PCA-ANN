name: Python quality checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile application
        run: python -m py_compile app.py streamlit_app.py prepare_dataset.py src/runtime.py src/archive_safety.py
      - name: Run dependency-free runtime tests
        run: python -m unittest discover -s tests -p test_runtime.py -v
